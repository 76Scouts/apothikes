<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<!-- Σελίδα κλεισίματος (21/11/2026). ΚΑΜΙΑ σύνδεση με βάση ή εξωτερική πηγή — μόνο αυτό το αρχείο και το εικονίδιο. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1D61AC">
<meta name="inv-build" content="kleisimo-2026-11-21">
<title>Αποθήκες 76ου — μεταφέρονται στο e76</title>
<link rel="icon" href="icon-apothikes-192.png">
<style>
  :root{--blue:#1D61AC;--yellow:#F6DC26;--ink:#1b2733;--muted:#5f6675;--bg:#eef3f8;--card:#fff;--line:#d9e2ec}
  @media (prefers-color-scheme: dark){:root{--ink:#e7edf3;--muted:#9fb0c1;--bg:#0e141b;--card:#16202b;--line:#2a3847}}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif}
  header{background:var(--blue);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px;border-bottom:4px solid var(--yellow)}
  header img{width:44px;height:44px;border-radius:10px;background:#fff}
  header b{font-size:18px}
  main{max-width:560px;margin:40px auto;padding:0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;box-shadow:0 1px 3px rgba(20,50,90,.08),0 6px 20px rgba(20,50,90,.06)}
  h1{margin:0 0 12px;font-size:23px;line-height:1.3;color:var(--blue)}
  @media (prefers-color-scheme: dark){h1{color:#8cc0ff}}
  p{margin:0}
  .local{display:none;margin-top:20px;padding:14px 16px;border-radius:10px;background:#fff6c9;border:1px solid #f0e08a;color:#6e5200;font-size:15px}
  .local button{margin-top:10px;font:inherit;font-weight:700;padding:9px 14px;border-radius:9px;border:0;background:var(--blue);color:#fff;cursor:pointer}
  footer{text-align:center;color:var(--muted);font-size:13px;margin:22px 0}
</style>
</head>
<body>
<header><img src="icon-apothikes-192.png" alt=""><b>76 — Καταγραφή Υλικού</b></header>
<main>
  <div class="card" role="status">
    <h1>Οι Αποθήκες του 76ου μεταφέρονται στο e76.</h1>
    <p>Μέχρι τότε η εφαρμογή δεν είναι διαθέσιμη.</p>
    <div class="local" id="local">
      <b>Αυτή η συσκευή κρατά <span id="n"></span> που δεν πρόλαβαν να ανέβουν.</b><br>
      Πάτησε για να τις κρατήσεις σε αρχείο και στείλ' το στον Αρχηγό Συστήματος.<br>
      <button type="button" id="save">Αποθήκευση σε αρχείο</button>
    </div>
  </div>
  <footer>76ο Σύστημα Προσκόπων Στροβόλου</footer>
</main>
<script>
/* Τρία πράγματα, όλα ΜΟΝΟ μέσα σ' αυτή τη συσκευή (καμία κλήση σε βάση ή αλλού):
   1. σβήνει τον παλιό service worker και ό,τι είχε αποθηκεύσει (για να μη δείχνει ποτέ ξανά παλιά δεδομένα χωρίς σήμα)·
   2. σβήνει το τοπικό αντίγραφο των υλικών της παλιάς εφαρμογής·
   3. αν υπήρχαν αλλαγές που δεν ανέβηκαν, ΔΕΝ τις σβήνει: προσφέρει να κρατηθούν σε αρχείο. */
(function(){
  try{ if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }); } }catch(e){}
  try{ if(window.caches){ caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); } }catch(e){}
  var q=[]; try{ q=JSON.parse(localStorage.getItem('76inv:queue')||'[]')||[]; }catch(e){ q=[]; }
  try{ for(var i=localStorage.length-1;i>=0;i--){ var k=localStorage.key(i);
    if(k&&k.indexOf('76inv:')===0&&!(q.length&&(k==='76inv:queue'||k==='76inv:failed')))localStorage.removeItem(k); } }catch(e){}
  if(q.length){
    document.getElementById('n').textContent=q.length===1?'1 αλλαγή':q.length+' αλλαγές';
    document.getElementById('local').style.display='block';
    document.getElementById('save').onclick=function(){
      var f=[]; try{ f=JSON.parse(localStorage.getItem('76inv:failed')||'[]')||[]; }catch(e){}
      var blob=new Blob([JSON.stringify({saved:new Date().toISOString(),pending:q,refused:f},null,1)],{type:'application/json'});
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='apothikes-allages-syskevis.json';
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
    };
  }
})();
</script>
</body>
</html>
